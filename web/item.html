<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Товар</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 960px; }
      pre { background: #f6f8fa; padding: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1 id="title">Профиль товара</h1>
    <div id="meta"></div>
    <h3>Атрибуты</h3>
    <pre id="attrs">{}</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const load = async () => {
        const res = await fetch(`/item/${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) {
          document.getElementById("title").textContent = "Товар не найден";
          return;
        }
        document.getElementById("title").textContent = data.name;
        document.getElementById("meta").textContent = `${data.category} • ID ${data.id}`;
        document.getElementById("attrs").textContent = JSON.stringify(data.attributes || {}, null, 2);
      };
      load();
    </script>
  </body>
</html>
