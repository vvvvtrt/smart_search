<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Товар</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 960px; }
      pre { background: #f6f8fa; padding: 12px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1 id="title">Профиль товара</h1>
    <div id="meta"></div>
    <div style="font-size:12px;color:#666;margin:6px 0 14px">Если вы на странице более 5 секунд — товар считается понравившимся</div>
    <h3>Атрибуты</h3>
    <pre id="attrs">{}</pre>
    <script>
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      const getCompanyKey = () => {
        try{
          const key = localStorage.getItem("active_company_key");
          return key || "default";
        }catch(e){
          return "default";
        }
      };
      const storeForKey = (suffix, value) => {
        try{
          localStorage.setItem(`${suffix}:${getCompanyKey()}`, JSON.stringify(Array.from(value)));
        }catch{}
      };
      const loadForKey = (suffix) => {
        try{
          const raw = localStorage.getItem(`${suffix}:${getCompanyKey()}`) || "[]";
          return new Set(JSON.parse(raw));
        }catch{
          return new Set();
        }
      };
      const storeVisited = () => {
        if (!id) return;
        try {
          const arr = loadForKey("view_ids");
          arr.add(id);
          storeForKey("view_ids", arr);
        } catch {}
      };
      const storeLiked = () => {
        if (!id) return;
        try{
          const liked = loadForKey("liked");
          liked.add(id);
          storeForKey("liked", liked);
        }catch{}
      };
      const storeDwell = () => {
        if (!id) return;
        try{
          const dwell = loadForKey("dwell_ids");
          dwell.add(id);
          storeForKey("dwell_ids", dwell);
        }catch{}
      };
      const load = async () => {
        const res = await fetch(`/item/${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) {
          document.getElementById("title").textContent = "Товар не найден";
          return;
        }
        document.getElementById("title").textContent = data.name;
        document.getElementById("meta").textContent = `${data.category} • ID ${data.id}`;
        document.getElementById("attrs").textContent = JSON.stringify(data.attributes || {}, null, 2);
        storeVisited();
      };
      let likedTimer = null;
      const startLikeTimer = () => {
        if (likedTimer || !id) return;
        likedTimer = setTimeout(() => {
          storeLiked();
          storeDwell();
        }, 5000);
      };
      startLikeTimer();
      load();
    </script>
  </body>
</html>
